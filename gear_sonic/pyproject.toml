[build-system]
requires = ["setuptools>=67", "wheel", "pip"]
build-backend = "setuptools.build_meta"

[project]
name = "gear_sonic"
dynamic = ["version"]
readme = {text = "NVIDIA Gear Sonic - Whole Body Control", content-type = "text/plain"}
classifiers = [
    "Intended Audience :: Science/Research",
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
authors = [
    {name = "NVIDIA Gear Lab"}
]
requires-python = ">=3.10"
dependencies = [
    "numpy==1.26.4",
    "scipy==1.15.3",
    "torch>=2.4.0",
    "joblib",
    "tqdm",
    "easydict",
    "loguru",
]
license = {text = "Apache-2.0"}

[project.optional-dependencies]
# Teleop: minimal deps for running ZMQ-based teleop
# pico_manager_thread_server.py + visualization (pyzmq, pyvista, pinocchio FK)
# Usage: pip install -e "gear_sonic[teleop]"
teleop = [
    "pyzmq",
    "msgpack",
    "msgpack-numpy",
    "pin",
    "pyvista; platform_machine != 'aarch64'",
]
# MuJoCo simulation (run_sim_loop.py and related scripts)
# Usage: pip install -e "gear_sonic[sim]"
sim = [
    "mujoco",
    "tyro",
    "pin",
    "pyyaml",
    "pyzmq",
    "msgpack",
    "msgpack-numpy",
    "opencv-python",
]
# Data collection: Sonic VLA data exporter with LeRobot dataset output
# Usage: pip install -e "gear_sonic[data_collection]"
data_collection = [
    "pyzmq",
    "msgpack",
    "msgpack-numpy",
    "pin",
    "tyro",
    "pyttsx3==2.90",
    "av>=14.2",
    "opencv-python",
    "lerobot @ git+https://github.com/huggingface/lerobot.git@a445d9c9da6bea99a8972daa4fe1fdd053d711d2",
    "datasets==3.6.0",
]
# Camera server: runs on the robot to publish camera frames over ZMQ
# Includes depthai (OAK cameras) by default. For other SDKs (pyrealsense2),
# install them separately into the .venv_camera venv.
# Usage: pip install -e "gear_sonic[camera]"
camera = [
    "pyzmq",
    "msgpack",
    "msgpack-numpy",
    "opencv-python",
    "tyro",
    "depthai",
    "requests",
]
# Inference: VLA inference client for running Isaac-GR00T policies
# Usage: pip install -e "gear_sonic[inference]"
inference = [
    "pyzmq",
    "msgpack",
    "msgpack-numpy",
    "pin",
    "tyro",
    "opencv-python",
    "scipy",
    "Isaac-GR00T @ git+https://github.com/NVIDIA/Isaac-GR00T.git",
]
# NOTE: there is deliberately no extra for the Isaac Lab teleoperation workflow.
#
# An extra would have to be resolved together with the base dependencies above, and the
# numpy==1.26.4 / scipy==1.15.3 pins downgrade Isaac Lab 3.0's numpy 2.x, which can break Isaac Sim.
# That workflow therefore installs this package with --no-deps and adds its one runtime dependency,
# onnxruntime-gpu, directly:
#
#     pip install --no-deps -e ./gear_sonic
#     pip install "onnxruntime-gpu[cuda,cudnn]>=1.20,<1.27"   # if torch.version.cuda is 12.x
#     pip install "onnxruntime-gpu[cuda,cudnn]>=1.27,<1.30"   # if torch.version.cuda is 13.x
#
# The onnxruntime-gpu version tracks the CUDA major version of the torch build in the target
# environment, not the host CUDA toolkit or Linux distribution: both torch and onnxruntime take
# their CUDA runtime from pip wheels. This cannot be expressed as a static pin, since PEP 508
# markers cannot key on a dependency's CUDA build. See
# docs/source/tutorials/isaaclab_teleop.md and
# https://onnxruntime.ai/docs/execution-providers/CUDA-ExecutionProvider.html
# Training: full RL training stack (Isaac Lab must be installed separately)
# Usage: pip install -e "gear_sonic[training]"
training = [
    "hydra-core==1.3.2",
    "wandb",
    "trl==0.28.0",
    "transformers>=4.56.2",
    "accelerate>=1.3.0",
    "tensorboard",
    "smpl_sim @ git+https://github.com/ZhengyiLuo/SMPLSim.git",
    "open3d",
    "vector_quantize_pytorch",
]

[tool.setuptools.packages.find]
where = [".."]
include = ["gear_sonic*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
gear_sonic = ["py.typed", "**/*.json", "**/*.yaml"]

[tool.setuptools.dynamic]
version = {attr = "gear_sonic.version.VERSION"}